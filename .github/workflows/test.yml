name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  payroll:
    name: payroll engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the payroll test suite
        run: node lib/payroll.test.js
